name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e
            export CI=true

            cd ${{ secrets.APP_DIR }}

            git fetch origin
            git reset --hard origin/main

            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
              nvm use 25 >/dev/null 2>&1 || nvm use 22 >/dev/null 2>&1 || true
            fi

            NODE_VERSION="$(node -v 2>/dev/null || echo v0.0.0)"
            NODE_MAJOR="$(node -p "process.versions.node.split('.')[0]" 2>/dev/null || echo 0)"
            NODE_MINOR="$(node -p "process.versions.node.split('.')[1]" 2>/dev/null || echo 0)"

            if [ "$NODE_MAJOR" -lt 22 ] || { [ "$NODE_MAJOR" -eq 22 ] && [ "$NODE_MINOR" -lt 13 ]; }; then
              echo "Node >=22.13 is required for pnpm@11.1.3, but current runtime is $NODE_VERSION"
              exit 1
            fi

            if command -v corepack >/dev/null 2>&1; then
              corepack enable
              corepack prepare pnpm@11.1.3 --activate
            else
              npm install --global --prefix "$HOME/.local" pnpm@11.1.3
              export PATH="$HOME/.local/bin:$PATH"
            fi

            node -v
            pnpm -v

            pnpm install --force

            pnpm --filter @workspace/api-server run build

            pnpm --filter @workspace/lexy run build
            
            pnpm --filter @workspace/lexy-site run build

            pm2 restart all
