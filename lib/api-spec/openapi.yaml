          nullable: true
        spentMicros: { type: integer, minimum: 0 }
        uncertainMicros: { type: integer, minimum: 0 }
        pendingMicros: { type: integer, minimum: 0 }
        costOperations:
          type: array
          items: { $ref: "#/components/schemas/SourcingCostOperation" }
        policy:
          allOf: [{ $ref: "#/components/schemas/SourcingPolicy" }]
          nullable: true
        reservations: { type: array, items: { $ref: "#/components/schemas/SourcingReservation" } }
