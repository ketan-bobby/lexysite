          type: integer
        activeJobs:
          type: integer
        totalCandidates:
          type: integer
        totalApplications:
          type: integer
        interviewsCompleted:
          type: integer
        offersExtended:
          type: integer
        hires:
          type: integer
        avgTimeToHireDays:
          type: number
          nullable: true
        avgInterviewScore:
          type: number
          nullable: true
        ghostingRatePercent:
          type: number
          nullable: true
        outreachReplyRate:
          type: number
          nullable: true
        topSources:
          type: array
          items:
            $ref: "#/components/schemas/SourceStat"
      required:
        - totalJobs
        - activeJobs
        - totalCandidates
        - totalApplications
        - interviewsCompleted
        - offersExtended
        - hires
        - topSources

    SourceStat:
      type: object
      properties:
        source:
          type: string
        count:
          type: integer
        conversionRate:
          type: number
      required:
        - source
        - count
        - conversionRate

    HiringFunnel:
      type: object
      properties:
        jobId:
          type: string
          nullable: true
        stages:
          type: array
          items:
            $ref: "#/components/schemas/FunnelStage"
      required:
        - stages

    FunnelStage:
      type: object
      properties:
        stage:
          type: string
        count:
          type: integer
        conversionRate:
          type: number
          nullable: true
      required:
        - stage
        - count

    InboxReplyInput:
      type: object
      required: [body]
      properties:
        subject:
          type: string
          description: 'Optional subject override; defaults to "Re: <inbox subject>"'
        body:
          type: string

    StorageUploadUrlInput:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    StorageUploadUrlResult:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/StorageUploadUrlInput"

    LearningAssessmentStartInput:
      type: object
      required: [courseId]
      additionalProperties: false
      properties:
        courseId: { type: string, minLength: 1 }

    LearningAssessmentSummary:
      type: object
      required: [id, courseId, title, path, status, taskSetVersion, rubricVersion, startedAt, completedAt, completedTasks, totalTasks, resumeTaskKey]
      properties:
        id: { type: string }
        courseId: { type: string }
        title: { type: string }
        path: { type: string, enum: [voice, chat_email] }
        status: { type: string, enum: [draft, completed] }
        taskSetVersion: { type: integer }
        rubricVersion: { type: string }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        completedTasks: { type: integer }
        totalTasks: { type: integer }
        resumeTaskKey: { type: [string, "null"] }

    LearningAssessmentTask:
      type: object
      required: [key, title, instructions, scenario, responseMode, minimumNonSpaceCharacters, coveredDimensions, progress]
      properties:
        key: { type: string }
        title: { type: string }
        instructions: { type: string }
        scenario: { type: string }
        responseMode: { type: string, enum: [spoken_or_typed, typed] }
        minimumNonSpaceCharacters: { type: integer }
        coveredDimensions:
          type: array
          items: { type: string }
        progress:
          type: object
          required: [revision, status, response, updatedAt]
          properties:
            revision: { type: integer }
            status: { type: string, enum: [not_started, draft, submitted] }
            response: { type: string }
            updatedAt: { type: [string, "null"], format: date-time }

    LearningAssessmentDetail:
      type: object
      required: [summary, tasks]
      properties:
        summary: { $ref: "#/components/schemas/LearningAssessmentSummary" }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/LearningAssessmentTask" }

    LearningAssessmentHome:
      type: object
      required: [available, unlockedCourses, assessments]
      properties:
        available: { type: boolean }
        unlockedCourses:
          type: array
          items: { type: string }
        assessments:
          type: array
          items: { $ref: "#/components/schemas/LearningAssessmentSummary" }

    LearningAssessmentTaskInput:
      type: object
      required: [revision, response, action]
      additionalProperties: false
      properties:
        revision: { type: integer, minimum: 0 }
        response: { type: string, maxLength: 6000 }
        action: { type: string, enum: [save_draft, submit] }

    LearningAssessmentDimension:
      type: object
      required: [dimension, label, level, levelLabel, evidence]
      properties:
        dimension: { type: string }
        label: { type: string }
        level: { type: string, enum: [emerging, developing, consistent, not_observed] }
        levelLabel: { type: string }
        evidence:
          type: array
          items: { type: string }
        observed: { type: integer }
        possible: { type: integer }

    LearningAssessmentComparison:
      type: object
      required: [available, reason]
      properties:
        available: { type: boolean }
        reason: { type: [string, "null"] }

    LearningAssessmentRecommendation:
      type: object
      required: [lessonId, courseId, lessonTitle, reason]
      properties:
        lessonId: { type: string }
        courseId: { type: string }
        lessonTitle: { type: string }
        reason: { type: string }

    LearningAssessmentReport:
      type: object
      required: [summary, versions, comparison, overallSummary, dimensions, recommendations]
      properties:
        summary: { $ref: "#/components/schemas/LearningAssessmentSummary" }
        versions:
          type: object
          required: [taskSetVersion, rubricVersion]
          properties:
            taskSetVersion: { type: integer }
            rubricVersion: { type: string }
        comparison: { $ref: "#/components/schemas/LearningAssessmentComparison" }
        overallSummary: { type: string }
        dimensions:
          type: array
          items: { $ref: "#/components/schemas/LearningAssessmentDimension" }
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/LearningAssessmentRecommendation" }

    LearningVoiceProgressStartInput:
      type: object
      required: [courseId]
      additionalProperties: false
      properties:
        courseId: { type: string, minLength: 1 }
    LearningVoiceProgressTurnInput:
      type: object
      required: [revision, response, action]
      additionalProperties: false
      properties:
        revision: { type: integer, minimum: 0 }
        response: { type: string, maxLength: 6000 }
        action: { type: string, enum: [save_draft, submit] }
    LearningVoiceProgressEmptyInput:
      type: object
      additionalProperties: false
    LearningVoiceProgressSummary:
      type: object
      required: [id, courseId, state, form, comparisonFamilyVersion, rubricVersion, evaluatorVersion, baselineCompletedAt, progressStartedAt, completedAt, completedTurns, totalTurns, reason, action, reviewedCount, totalReviewLessons, reviewAttemptId]
      properties:
        id: { type: string }
        courseId: { type: string }
        state: { type: string, enum: [baseline_draft, training_required, progress_draft, completed] }
        form: { type: string, enum: [A, B] }
        comparisonFamilyVersion: { type: string }
        rubricVersion: { type: string }
        evaluatorVersion: { type: string }
        baselineCompletedAt: { type: [string, "null"], format: date-time }
        progressStartedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        completedTurns: { type: integer }
        totalTurns: { type: integer }
        reason: { type: string }
        action: { type: string }
        reviewedCount: { type: integer }
        totalReviewLessons: { type: integer }
        reviewAttemptId: { type: [string, "null"] }
    LearningVoiceProgressTurn:
      type: object
      required: [key, prompt, phase, form, minimumNonSpaceCharacters, progress]
      properties:
        key: { type: string }
        prompt: { type: string }
        phase: { type: string, enum: [baseline, progress] }
        form: { type: string, enum: [A, B] }
        minimumNonSpaceCharacters: { type: integer }
        progress:
          type: object
          required: [revision, status, response, updatedAt]
          properties:
            revision: { type: integer }
            status: { type: string, enum: [draft, submitted, not_started] }
            response: { type: string }
            updatedAt: { type: [string, "null"], format: date-time }
    LearningVoiceProgressDetail:
      type: object
      required: [summary, turns, privacy]
      properties:
        summary: { $ref: "#/components/schemas/LearningVoiceProgressSummary" }
        turns:
          type: array
          items: { $ref: "#/components/schemas/LearningVoiceProgressTurn" }
        privacy:
          type: object
          required: [audioStorage, speechDisclosure]
          properties:
            audioStorage: { type: string }
            speechDisclosure: { type: string }
    LearningVoiceProgressHome:
      type: object
      required: [available, eligibleCourses, cycles]
      properties:
        available: { type: boolean }
        eligibleCourses: { type: array, items: { type: string } }
        cycles:
          type: array
          items: { $ref: "#/components/schemas/LearningVoiceProgressSummary" }
    LearningVoiceProgressReport:
      type: object
      required: [summary, comparison, baseline, progress, recommendations]
      properties:
        summary: { $ref: "#/components/schemas/LearningVoiceProgressSummary" }
        comparison:
          type: object
          required: [comparable, reason, dimensions]
          properties:
            comparable: { type: boolean }
            reason: { type: string }
            dimensions:
              type: array
              items:
                type: object
                required: [dimension, baselineLevel, progressLevel, observedDifference, evidence]
                properties:
                  dimension: { type: string }
                  baselineLevel: { type: string }
                  progressLevel: { type: string }
                  observedDifference: { type: string, enum: [higher, same, lower, not_comparable] }
                  evidence: { type: array, items: { type: string } }
        baseline: { type: object, additionalProperties: true }
        progress: { type: object, additionalProperties: true }
        recommendations: { type: array, items: { type: string } }
    LearningVoiceTrainingReview:
      type: object
      required: [attemptId, cycleId, courseId, status, startedAt, completedAt, lessons, reviewedCount, totalLessons]
      properties:
        attemptId: { type: string }
        cycleId: { type: string }
        courseId: { type: string }
        status: { type: string, enum: [in_progress, completed] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        reviewedCount: { type: integer }
        totalLessons: { type: integer }
        lessons:
          type: array
          items:
            type: object
            required: [id, title, reviewedAt]
            properties:
              id: { type: string }
              title: { type: string }
              reviewedAt: { type: [string, "null"], format: date-time }
    LearningAchievements:
      type: object
      required: [creditsBalance, creditLabel, nonMonetaryDisclaimer, badges, recentActivity, milestones]
      properties:
        creditsBalance: { type: integer }
        creditLabel: { type: string }
        nonMonetaryDisclaimer: { type: string }
        badges: { type: array, items: { type: object, required: [key, title, description, earnedAt], properties: { key: { type: string }, title: { type: string }, description: { type: string }, earnedAt: { type: string, format: date-time } } } }
        recentActivity: { type: array, items: { type: object, required: [id, eventType, title, description, creditsDelta, earnedAt], properties: { id: { type: string }, eventType: { type: string }, title: { type: string }, description: { type: string }, creditsDelta: { type: integer }, earnedAt: { type: string, format: date-time } } } }
        milestones: { type: array, items: { type: object, required: [key, title, target, current, completed], properties: { key: { type: string }, title: { type: string }, target: { type: integer }, current: { type: integer }, completed: { type: boolean } } } }
