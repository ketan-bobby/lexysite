openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Lexy AI Hiring Platform API
servers:
  - url: /api
    description: Base API path

tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: tenants
    description: Tenant management
  - name: users
    description: User management
  - name: jobs
    description: Job management
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: icp
    description: Ideal Candidate Profile
  - name: candidates
    description: Candidate management
  - name: applications
    description: Applications
  - name: interviews
    description: AI Interviews
  - name: prep
    description: Interview Prep Engine
  - name: coordinator
    description: Interview Coordination
  - name: verify
    description: Candidate Verification
  - name: talent-match
    description: Talent Matching
  - name: resume-screen
    description: Resume Screening
  - name: sourcing
    description: Sourcing Engine
  - name: outreach
    description: Outreach Campaigns
  - name: communication
    description: Communication Engine
  - name: analytics
    description: Analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/candidate-login:
    post:
      operationId: candidateLogin
      tags: [auth]
      summary: Candidate login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # TENANTS
  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List all tenants
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/{tenantId}:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get tenant
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
    put:
      operationId: updateTenant
      tags: [tenants]
      summary: Update tenant
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        "200":
          description: Tenant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  # USERS
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      parameters:
        - name: role
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # JOBS
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Jobs list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsListResponse"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{jobId}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    put:
      operationId: updateJob
      tags: [jobs]
      summary: Update job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobRequest"
      responses:
        "200":
          description: Job updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ICP
  /jobs/{jobId}/icp:
    get:
      operationId: getJobIcp
      tags: [icp]
      summary: Get ICP for job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ICP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeaCandiateProfile"
    post:
      operationId: generateIcp
      tags: [icp]
      summary: Generate ICP from JD
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateIcpRequest"
      responses:
        "200":
          description: Generated ICP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeaCandiateProfile"

  /jobs/{jobId}/icp/versions:
    get:
      operationId: listIcpVersions
      tags: [icp]
      summary: List ICP versions
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ICP versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdeaCandiateProfile"

  # CANDIDATES
  /candidates:
    get:
      operationId: listCandidates
      tags: [candidates]
      summary: List candidates
      parameters:
        - name: jobId
          in: query
          schema:
            type: string
        - name: stage
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidatesListResponse"
    post:
      operationId: createCandidate
      tags: [candidates]
      summary: Create candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCandidateRequest"
      responses:
        "201":
          description: Candidate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"

  /candidates/{candidateId}:
    get:
      operationId: getCandidate
      tags: [candidates]
      summary: Get candidate
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
    put:
      operationId: updateCandidate
      tags: [candidates]
      summary: Update candidate
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCandidateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"

  # APPLICATIONS
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List applications
      parameters:
        - name: jobId
          in: query
          schema:
            type: string
        - name: candidateId
          in: query
          schema:
            type: string
        - name: stage
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Create application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /applications/{applicationId}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
    put:
      operationId: updateApplication
      tags: [applications]
      summary: Update application stage
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  # AI INTERVIEWS
  /interviews:
    get:
      operationId: listInterviews
      tags: [interviews]
      summary: List interviews
      parameters:
        - name: applicationId
          in: query
          schema:
            type: string
        - name: candidateId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Interviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InterviewSession"

  /interviews/plans:
    post:
      operationId: createInterviewPlan
      tags: [interviews]
      summary: Create interview plan from JD + ICP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInterviewPlanRequest"
      responses:
        "201":
          description: Interview plan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewPlan"

  /interviews/start:
    post:
      operationId: startInterview
      tags: [interviews]
      summary: Start an interview session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartInterviewRequest"
      responses:
        "201":
          description: Interview started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"

  /interviews/{interviewId}:
    get:
      operationId: getInterview
      tags: [interviews]
      summary: Get interview
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Interview session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"

  /interviews/{interviewId}/answer:
    post:
      operationId: submitInterviewAnswer
      tags: [interviews]
      summary: Submit an answer
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAnswerRequest"
      responses:
        "200":
          description: Next question or completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResponse"

  /interviews/{interviewId}/end:
    post:
      operationId: endInterview
      tags: [interviews]
      summary: End interview
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Interview ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSummary"

  /interviews/{interviewId}/summary:
    get:
      operationId: getInterviewSummary
      tags: [interviews]
      summary: Get interview summary
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSummary"

  # CANDIDATE PREP
  /prep/generate:
    post:
      operationId: generatePrepPlan
      tags: [prep]
      summary: Generate prep plan for candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePrepRequest"
      responses:
        "200":
          description: Prep plan generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepPlan"

  /prep/sessions:
    get:
      operationId: listPrepSessions
      tags: [prep]
      summary: List prep sessions
      parameters:
        - name: candidateId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Prep sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrepSession"
    post:
      operationId: startPrepSession
      tags: [prep]
      summary: Start prep session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPrepSessionRequest"
      responses:
        "201":
          description: Prep session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepSession"

  /prep/sessions/{sessionId}/answer:
    post:
      operationId: submitPrepAnswer
      tags: [prep]
      summary: Submit prep answer
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAnswerRequest"
      responses:
        "200":
          description: Feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepFeedback"

  # COORDINATOR
  /coordinator/schedules:
    get:
      operationId: listSchedules
      tags: [coordinator]
      summary: List interview schedules
      parameters:
        - name: applicationId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InterviewSchedule"
    post:
      operationId: createSchedule
      tags: [coordinator]
      summary: Create schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleRequest"
      responses:
        "201":
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSchedule"

  /coordinator/schedules/{scheduleId}:
    put:
      operationId: updateSchedule
      tags: [coordinator]
      summary: Update/reschedule
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSchedule"

  # VERIFY
  /verify/{candidateId}:
    get:
      operationId: getVerificationStatus
      tags: [verify]
      summary: Get verification status
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verification status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationStatus"
    post:
      operationId: runVerification
      tags: [verify]
      summary: Run verification checks
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationStatus"

  # TALENT MATCH
  /talent-match:
    post:
      operationId: matchCandidateToIcp
      tags: [talent-match]
      summary: Match candidate to ICP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TalentMatchRequest"
      responses:
        "200":
          description: Match result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TalentMatch"

  /talent-match/rediscover:
    post:
      operationId: rediscoverCandidates
      tags: [talent-match]
      summary: Rediscover ATS candidates for a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RediscoverRequest"
      responses:
        "200":
          description: Rediscovered candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TalentMatch"

  # RESUME SCREENS
  /resume-screens:
    post:
      operationId: screenResume
      tags: [resume-screen]
      summary: Screen a resume against ICP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenResumeRequest"
      responses:
        "200":
          description: Screening result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeScreen"

  /resume-screens/{candidateId}:
    get:
      operationId: getResumeScreen
      tags: [resume-screen]
      summary: Get resume screen for candidate
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resume screen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeScreen"

  # SOURCING
  /sourcing/candidates:
    get:
      operationId: listSourcedCandidates
      tags: [sourcing]
      summary: List sourced candidates
      parameters:
        - name: jobId
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Sourced candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourcedCandidate"

  /sourcing/ingest:
    post:
      operationId: ingestProfile
      tags: [sourcing]
      summary: Ingest a public profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestProfileRequest"
      responses:
        "200":
          description: Ingested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcedCandidate"

  /sourcing/merge:
    post:
      operationId: mergeIdentities
      tags: [sourcing]
      summary: Merge candidate identities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeIdentitiesRequest"
      responses:
        "200":
          description: Merged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # OUTREACH
  /outreach/campaigns:
    get:
      operationId: listOutreachCampaigns
      tags: [outreach]
      summary: List outreach campaigns
      responses:
        "200":
          description: Campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutreachCampaign"
    post:
      operationId: createOutreachCampaign
      tags: [outreach]
      summary: Create outreach campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignRequest"
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachCampaign"

  /outreach/campaigns/{campaignId}:
    get:
      operationId: getOutreachCampaign
      tags: [outreach]
      summary: Get campaign
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachCampaign"

  /outreach/campaigns/{campaignId}/enroll:
    post:
      operationId: enrollCandidates
      tags: [outreach]
      summary: Enroll candidates in campaign
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollCandidatesRequest"
      responses:
        "200":
          description: Enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /outreach/campaigns/{campaignId}/autopilot:
    post:
      operationId: toggleAutopilot
      tags: [outreach]
      summary: Start/pause/stop autopilot
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutopilotToggleRequest"
      responses:
        "200":
          description: Autopilot updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachCampaign"

  /outreach/inbox:
    get:
      operationId: getRecruiterInbox
      tags: [outreach]
      summary: Get recruiter inbox items
      responses:
        "200":
          description: Inbox items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecruiterInboxItem"

  /outreach/inbox/{id}/reply:
    post:
      operationId: replyToInboxItem
      tags: [outreach]
      summary: Send an email reply to a candidate from a recruiter inbox item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                subject:
                  type: string
                  description: 'Optional subject override; defaults to "Re: <inbox subject>"'
                body:
                  type: string
                  description: Plain-text body of the reply email
      responses:
        "200":
          description: Reply sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  simulated: { type: boolean }
                  messageId: { type: string, nullable: true }
        "400":
          description: Invalid body or missing candidate email
        "404":
          description: Inbox item not found

  # COMMUNICATION
  /communication/events:
    get:
      operationId: listCommunicationEvents
      tags: [communication]
      summary: List communication events
      parameters:
        - name: candidateId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunicationEvent"
    post:
      operationId: sendCommunication
      tags: [communication]
      summary: Send a communication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendCommunicationRequest"
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationEvent"

  /communication/ghosting-risks:
    get:
      operationId: listGhostingRisks
      tags: [communication]
      summary: List candidates at ghosting risk
      responses:
        "200":
          description: Ghosting risks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GhostingRisk"

  # CANDIDATE PORTAL
  /portal/dashboard:
    get:
      operationId: getCandidateDashboard
      tags: [candidates]
      summary: Get candidate portal dashboard
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateDashboard"

  /portal/notifications:
    get:
      operationId: listCandidateNotifications
      tags: [candidates]
      summary: Get candidate notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CandidateNotification"

  # ANALYTICS
  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Get analytics overview
      parameters:
        - name: jobId
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  /analytics/funnel:
    get:
      operationId: getHiringFunnel
      tags: [analytics]
      summary: Get hiring funnel data
      parameters:
        - name: jobId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Funnel data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HiringFunnel"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestUploadUrlBody'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestUploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
        '500':
          description: Failed to generate upload URL.

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
        '500':
          description: Failed to serve object.

