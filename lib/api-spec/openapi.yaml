      responses:
        "200":
          description: Draft captured or idempotent retry acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowMutationResult" }
        "409": { description: Brief changed or idempotency conflict }

  /jobs/{jobId}/workflow-journeys/{journeyId}/approve:
    post:
      operationId: approveJobWorkflowJourney
      tags: [jobs]
      summary: Human approval of one exact journey and brief version
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: journeyId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowMutationInput" }
      responses:
        "200":
          description: Approval recorded without activating workers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowMutationResult" }
        "403": { description: Human approver role required }
        "409": { description: Brief stale or requisition not approved }

  /jobs/{jobId}/candidate-workflows:
    post:
      operationId: enrollCandidateWorkflow
      tags: [jobs]
      summary: Explicitly bind a linked candidate to an approved journey version
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowEnrollmentInput" }
      responses:
        "200":
          description: Candidate planning state created without running agents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowMutationResult" }
        "404": { description: Candidate or journey outside scope }
        "409": { description: Existing open workflow or stale journey }

  /jobs/{jobId}/candidate-workflows/{workflowId}/control:
    post:
      operationId: controlCandidateWorkflow
      tags: [jobs]
      summary: Pause, resume or cancel only this planned candidate workflow
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: workflowId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowControlInput" }
      responses:
        "200":
          description: Control recorded atomically with an audit event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowMutationResult" }
        "409": { description: Revision conflict or invalid transition }

  /jobs/{jobId}/candidate-workflows/{workflowId}/execute:
    post:
      operationId: launchCandidateWorkflowAction
      tags: [jobs]
      summary: Request the next guarded action for one approved candidate workflow
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: workflowId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowActionLaunchInput" }
      responses:
        "200":
          description: Agent action returned; workflow evidence still requires review
          content:
            application/json:
              schema:
                type: object
                required: [runId, status]
                properties:
                  runId: { type: string }
                  status: { type: string }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Staff authority required }
        "404": { description: Job or workflow outside scope }
        "409": { description: "Controls, revision, prerequisites or live activation block execution" }

  /jobs/{jobId}/candidate-workflows/{workflowId}/follow-ups:
    get:
      operationId: getWorkflowFollowUps
      tags: [Jobs]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: workflowId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Persisted follow-ups and held legacy campaign messages
