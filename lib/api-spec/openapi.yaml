                required: [provider, selected, available, kind, note]
                properties:
                  provider: { type: string, enum: [pdl, serp, enrichlayer] }
                  selected: { type: boolean }
                  available: { type: boolean }
                  kind: { type: string, enum: [discovery, enrichment] }
                  note: { type: string }
        externalRuns:
          type: array
          items:
            type: object
            required: [reservationId, operationId, profiles]
            properties:
              status:
                type: string
                enum: [claimed, succeeded, uncertain, skipped]
