    post:
      operationId: controlWorkflowFollowUp
      tags: [Jobs]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: workflowId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowFollowUpInput" }
      responses:
        "200":
          description: Audited mutation; approval alone is not delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowMutationResult" }
        "400": { description: Invalid input }
        "403": { description: Approval authority required }
        "404": { description: Not found }
        "409": { description: Stale revision or blocked contact }
  /jobs/{jobId}/candidate-workflows/{workflowId}/recover:
    post:
      operationId: recoverCandidateWorkflowAction
      tags: [Jobs]
      summary: Authorize one recovery after trusted pre-effect proof, retaining prior claims
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: workflowId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowRecoveryInput" }
      responses:
        "200":
          description: Recovery authorized; no provider work or send performed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowMutationResult" }
        "409": { description: "Missing proof, stale revision or uncertain effects" }
  /jobs/{jobId}/candidate-workflows/{workflowId}/live-pilot:
    post:
      operationId: controlWorkflowLivePilot
      tags: [jobs]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: workflowId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowLivePilotInput" }
      responses:
        "200":
          description: Scoped pilot authority updated; no agent is launched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowMutationResult" }
        "400": { description: Invalid request }
        "401": { description: Unauthorized }
        "403": { description: Approval authority required }
        "404": { description: Not found }
        "409": { description: Workflow or pilot prerequisites changed }

  /jobs/{jobId}/candidate-workflows/{workflowId}/identity-resolution:
    post:
      operationId: resolveWorkflowIdentity
      tags: [jobs]
      summary: Save an audited human identity decision without executing agents or sending contact
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: workflowId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowIdentityResolutionInput" }
      responses:
        "200":
          description: Decision and workflow review recorded atomically; synthetic clearance never verifies a real identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowMutationResult" }
        "400": { description: Invalid evidence or missing explicit acknowledgment }
        "401": { description: Unauthorized }
        "403": { description: Approval authority required }
        "404": { description: Not found }
        "409": { description: "Stale, paused, terminal or out-of-sequence workflow or identity source" }

  /jobs/{jobId}/candidate-workflows/{workflowId}/evidence:
    post:
      operationId: recordCandidateWorkflowEvidence
      tags: [jobs]
      summary: Record human-provided evidence without changing the assisted pipeline
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: workflowId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowEvidenceInput" }
      responses:
        "200":
          description: Evidence and workflow revision saved together
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowMutationResult" }
        "409": { description: "Paused, cancelled, stale or out-of-order step" }

  /jobs/{jobId}/candidate-workflows/{workflowId}/decision-correction:
    post:
      operationId: correctCandidateWorkflowDecision
