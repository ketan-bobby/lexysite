        nonMonetaryDisclaimer: { type: string }
        badges: { type: array, items: { type: object, required: [key, title, description, earnedAt], properties: { key: { type: string }, title: { type: string }, description: { type: string }, earnedAt: { type: string, format: date-time } } } }
        recentActivity: { type: array, items: { type: object, required: [id, eventType, title, description, creditsDelta, earnedAt], properties: { id: { type: string }, eventType: { type: string }, title: { type: string }, description: { type: string }, creditsDelta: { type: integer }, earnedAt: { type: string, format: date-time } } } }
        milestones: { type: array, items: { type: object, required: [key, title, target, current, completed], properties: { key: { type: string }, title: { type: string }, target: { type: integer }, current: { type: integer }, completed: { type: boolean } } } }
