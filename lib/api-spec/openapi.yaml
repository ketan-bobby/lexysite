        canEdit: { type: boolean }
        canApprove: { type: boolean }
        currency: { type: string, enum: [USD] }
        sourcingScope: { type: string, enum: [client_current_employees, known_nonemployees] }
        executionEnabled: { type: boolean }
        outreachEnabled: { type: boolean }
        trustedPricingAvailable: { type: boolean }
        costAnalysis: { $ref: "#/components/schemas/SourcingCostAnalysis" }
        monthlyPackages:
