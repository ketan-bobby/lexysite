        cycles:
          type: array
          items: { $ref: "#/components/schemas/LearningVoiceProgressSummary" }
    LearningVoiceProgressReport:
      type: object
      required: [summary, comparison, baseline, progress, recommendations]
      properties:
        summary: { $ref: "#/components/schemas/LearningVoiceProgressSummary" }
        comparison:
          type: object
          required: [comparable, reason, dimensions]
          properties:
            comparable: { type: boolean }
            reason: { type: string }
            dimensions:
              type: array
              items:
                type: object
                required: [dimension, baselineLevel, progressLevel, observedDifference, evidence]
                properties:
                  dimension: { type: string }
                  baselineLevel: { type: string }
                  progressLevel: { type: string }
                  observedDifference: { type: string, enum: [higher, same, lower, not_comparable] }
                  evidence: { type: array, items: { type: string } }
        baseline: { type: object, additionalProperties: true }
        progress: { type: object, additionalProperties: true }
        recommendations: { type: array, items: { type: string } }
    LearningVoiceTrainingReview:
      type: object
      required: [attemptId, cycleId, courseId, status, startedAt, completedAt, lessons, reviewedCount, totalLessons]
      properties:
        attemptId: { type: string }
        cycleId: { type: string }
        courseId: { type: string }
        status: { type: string, enum: [in_progress, completed] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        reviewedCount: { type: integer }
        totalLessons: { type: integer }
        lessons:
          type: array
          items:
            type: object
            required: [id, title, reviewedAt]
            properties:
              id: { type: string }
              title: { type: string }
              reviewedAt: { type: [string, "null"], format: date-time }
    LearningAchievements:
