            schema: { $ref: "#/components/schemas/LearningVoiceProgressEmptyInput" }
      responses:
        "200":
          description: Updated training review detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningVoiceTrainingReview" }

  /portal/learning-growth/achievements:
    get:
      operationId: getLearningAchievements
      tags: [candidates]
      summary: Get private learning recognition
      responses:
        "200":
          description: Candidate-private non-monetary recognition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningAchievements" }

  /portal/learning-growth/voice-progress/{cycleId}/complete-training-review:
    parameters:
      - { name: cycleId, in: path, required: true, schema: { type: string } }
    post:
      operationId: completeLearningVoiceProgressTrainingReview
      tags: [candidates]
      summary: Confirm review of already completed voice training
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningVoiceProgressEmptyInput" }
      responses:
        "200":
          description: Ready progress detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningVoiceProgressDetail" }
        "403": { description: Matching completed training required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /portal/learning-growth/voice-progress/{cycleId}/report:
    parameters:
      - { name: cycleId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getLearningVoiceProgressReport
      tags: [candidates]
      summary: Get a completed private observed-change report
      responses:
        "200":
          description: Frozen comparison report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningVoiceProgressReport" }
        "409": { description: Cycle is not completed, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /portal/dashboard:
    get:
      operationId: getCandidateDashboard
      tags: [candidates]
      summary: Get candidate portal dashboard
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateDashboard"

  /portal/notifications:
    get:
      operationId: listCandidateNotifications
      tags: [candidates]
      summary: Get candidate notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CandidateNotification"

  # ANALYTICS
  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Get analytics overview
      parameters:
        - name: jobId
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  /analytics/funnel:
    get:
      operationId: getHiringFunnel
      tags: [analytics]
      summary: Get hiring funnel data
      parameters:
        - name: jobId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Funnel data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HiringFunnel"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageUploadUrlInput"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUploadUrlResult"
        "400":
          description: Missing or invalid required fields.
        "500":
          description: Failed to generate upload URL.

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
        "500":
          description: Failed to serve object.

  /interviews/{interviewId}/capture-diagnostics:
    parameters:
      - { name: interviewId, in: path, required: true, schema: { type: string } }
    post:
      operationId: recordInterviewCaptureDiagnostic
      tags: [interviews]
      summary: Record content-free, client-reported capture diagnostics
      description: Requires the active interview cookie, same-origin request, current consent and approved work order. Never contributes to assessment or proctoring scores.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewCaptureDiagnosticInput"
      responses:
        "202":
          description: Diagnostic recorded idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewCaptureDiagnosticReceipt"
        "401": { description: Interview authentication required }
        "403": { description: Request origin or work-order approval rejected }
        "410": { description: Interview no longer active }
        "412": { description: Current consent required }
        "429": { description: Diagnostic rate limit exceeded }
        "503": { description: Diagnostic persistence unavailable }
    get:
      operationId: getInterviewCaptureDiagnostics
      tags: [interviews]
      summary: Read capture diagnostics with staff interview ownership checks
      responses:
        "200":
          description: Client-reported diagnostics, not speech-accuracy evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewCaptureDiagnosticReport"
        "401": { description: Authentication required }
        "403": { description: Staff access required }
        "404": { description: Interview not visible to caller }

  /interviews/{interviewId}/recording-segments:
    parameters:
      - { name: interviewId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getInterviewRecordingSegments
      tags: [interviews]
      summary: List privately retained recording attempts
      responses:
        "200":
          description: Recordings grouped by recorder attempt, in time order
          content:
            application/json:
              schema:
                type: object
                required: [recordings]
                properties:
                  recordings:
                    type: array
                    items:
                      type: object
                      required: [attemptId, partCount, bytes, startedAt, contiguous]
                      properties:
                        attemptId: { type: string, format: uuid }
                        partCount: { type: integer }
                        bytes: { type: integer }
                        startedAt: { type: string, format: date-time }
                        contiguous: { type: boolean }
        "401": { description: Authentication required }
        "404": { description: Session not visible }
        "503": { description: Storage temporarily unavailable }
    post:
      operationId: uploadInterviewRecordingSegment
      tags: [interviews]
      summary: Checkpoint an active consented interview recording
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/InterviewRecordingSegmentForm"
      responses:
        "200":
          description: Segment saved, or identical retry acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [saved, attemptId, index]
                properties:
                  saved: { type: boolean }
                  attemptId: { type: string, format: uuid }
                  index: { type: integer }
        "400": { description: Invalid multipart fields or media }
        "401": { description: Interview cookie required }
        "403": { description: Same-origin or work-order approval gate failed }
        "409": { description: Segment already exists with different content }
        "412": { description: AI consent required }
        "503": { description: Checkpoint could not be saved }
  /interviews/{interviewId}/recording-segments/{attemptId}:
    get:
      operationId: downloadInterviewRecordingSegment
      tags: [interviews]
      summary: Stream one privately retained recording attempt
      parameters:
        - { name: interviewId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: attemptId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Ordered container chunks from a single recorder
          content:
            video/webm:
              schema: { type: string, format: binary }
            video/mp4:
              schema: { type: string, format: binary }
        "400": { description: Invalid recording id }
        "401": { description: Authentication required }
        "404": { description: Recording not visible }
        "409": { description: Recording has missing chunks }
        "503": { description: Playback temporarily unavailable }
  /jobs/{jobId}/candidates/{candidateId}/meeting-notes:
    parameters: &meetingNoteContext
      - { name: jobId, in: path, required: true, schema: { type: string } }
      - { name: candidateId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listMeetingNotes
      tags: [interviews]
      summary: List private imported human-interview notes for an authorized job applicant.
      responses:
        "200":
          description: Latest 100 recordings.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MeetingNote" } }
    post:
      operationId: uploadMeetingNote
      tags: [interviews]
      summary: Import a consented recording, up to 100 MB and 60 minutes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/MeetingRecordingInput" }
      responses:
        "201":
          description: Recording saved; no automatic AI processing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingNote" }
  /jobs/{jobId}/candidates/{candidateId}/meeting-notes/native-google-meet/appointments:
    parameters: *meetingNoteContext
    get:
      operationId: listNativeMeetRecordingAppointments
      tags: [interviews]
      responses:
        "200":
          description: Current applicant appointments with a verified Google organizer receipt owned by this staff user. No provider call.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/NativeZoomAppointment" } }
  /jobs/{jobId}/candidates/{candidateId}/meeting-notes/native-google-meet/conferences:
    parameters: *meetingNoteContext
    post:
      operationId: listNativeMeetRecordingConferences
      tags: [interviews]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NativeZoomPreviewInput" }
      responses:
        "200":
          description: Completed conference instances within the server-derived appointment window. Explicit staff selection required.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/NativeMeetConference" } }
        "409": { description: Current organizer receipt or separate recording authorization required. }
  /jobs/{jobId}/candidates/{candidateId}/meeting-notes/native-google-meet/preview:
    parameters: *meetingNoteContext
    post:
      operationId: previewNativeMeetRecording
      tags: [interviews]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NativeMeetPreviewInput" }
      responses:
        "200":
          description: Metadata and short-lived file-bound review tokens; no playback or download URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NativeMeetRecordingPreview" }
        "409": { description: "Appointment, account or conference changed." }
  /jobs/{jobId}/candidates/{candidateId}/meeting-notes/native-google-meet/import:
    parameters: *meetingNoteContext
    post:
      operationId: importNativeMeetRecording
      tags: [interviews]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NativeZoomRecordingInput" }
      responses:
        "201":
          description: Scoped private source saved or prior import reused; no automatic processing or communications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingNote" }
        "409": { description: Preview expired or current authority/evidence changed. }
  /jobs/{jobId}/candidates/{candidateId}/meeting-notes/native-zoom/appointments:
    parameters: *meetingNoteContext
    get:
      operationId: listNativeZoomRecordingAppointments
      tags: [interviews]
      summary: List only this staff host's confirmed Lexy Zoom appointments for this applicant.
      responses:
        "200":
          description: At most 20 scoped appointments; no provider request.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NativeZoomAppointment" }
  /jobs/{jobId}/candidates/{candidateId}/meeting-notes/native-zoom/preview:
    parameters: *meetingNoteContext
    post:
      operationId: previewNativeZoomRecording
      tags: [interviews]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NativeZoomPreviewInput" }
      responses:
        "200":
          description: Scoped host-owned recording metadata and short-lived file reviews, never provider download URLs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NativeZoomRecordingPreview" }
        "409": { description: Original host connection or cloud-recording permission required. }
  /jobs/{jobId}/candidates/{candidateId}/meeting-notes/native-zoom/import:
    parameters: *meetingNoteContext
    post:
      operationId: importNativeZoomRecording
      tags: [interviews]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NativeZoomRecordingInput" }
      responses:
        "201":
          description: Private copy saved or prior imported copy returned; no automatic processing or messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingNote" }
        "409": { description: "Stale preview, changed recording or original host authorization required." }
  /jobs/{jobId}/candidates/{candidateId}/meeting-notes/{noteId}:
    parameters: &meetingNoteIdentity
      - { name: jobId, in: path, required: true, schema: { type: string } }
      - { name: candidateId, in: path, required: true, schema: { type: string } }
      - { name: noteId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getMeetingNote
      tags: [interviews]
      responses:
        "200":
          description: Private recording details and source-grounded draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingNote" }
    delete:
      operationId: deleteMeetingNote
      tags: [interviews]
      responses:
        "204": { description: Recording and notes removed. }
  /jobs/{jobId}/candidates/{candidateId}/meeting-notes/{noteId}/process:
    parameters: *meetingNoteIdentity
    post:
      operationId: processMeetingNote
      tags: [interviews]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeetingProcessingInput" }
      responses:
        "202":
          description: Explicit processing attempt claimed; poll details for completion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingNote" }
        "409": { description: "Already processed, live lease, or stale version." }
  /jobs/{jobId}/candidates/{candidateId}/meeting-notes/{noteId}/speaker-review:
    parameters: *meetingNoteIdentity
    put:
      operationId: saveMeetingSpeakerReview
      tags: [interviews]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeetingSpeakerReviewInput" }
      responses:
        "200":
          description: Human speaker labels saved against the current source and review revision; not identity proof or an approved assessment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingNote" }
        "409": { description: "Source or prior review changed." }
        "422": { description: "Unknown or repeated speaker group." }
  /jobs/{jobId}/candidates/{candidateId}/meeting-notes/{noteId}/question-review:
    parameters: *meetingNoteIdentity
    put:
      operationId: saveMeetingQuestionReview
      tags: [interviews]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeetingQuestionReviewInput" }
      responses:
        "200":
          description: Human-authored source annotations saved; not a hiring assessment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingNote" }
        "409": { description: Source or review changed; refresh before saving. }
        "422": { description: Question or exact transcript evidence is invalid. }
  /jobs/{jobId}/candidates/{candidateId}/meeting-notes/{noteId}/notes-export:
    parameters: *meetingNoteIdentity
    get:
      operationId: downloadMeetingSavedNotes
      tags: [interviews]
      description: Private snapshot of saved source notes; no AI work or hiring assessment approval.
      responses:
        "200":
          description: UTF-8 plain text attachment containing the saved transcript, draft summary and manual question review.
          content:
            text/plain:
              schema: { type: string, format: binary }
        "401": { description: Staff authentication required. }
        "403": { description: Staff access required. }
        "404": { description: Recording or authorized job/candidate context not found. }
        "409": { description: A saved transcript is unavailable or deletion is pending. }
  /jobs/{jobId}/candidates/{candidateId}/meeting-notes/{noteId}/recording:
    parameters: *meetingNoteIdentity
    get:
      operationId: downloadMeetingRecording
      tags: [interviews]
      responses:
        "200":
          description: Authenticated private attachment; never a public object URL.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /jobs/{jobId}/candidates/{candidateId}/meeting-assistant:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string } }
      - { name: candidateId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getMeetingAttendance
      tags: [MeetingAssistant]
      responses:
        "200":
          description: Private employer authorization and original-host appointments; no calendar contents or provider credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingAttendanceView" }
        "401": { description: Active staff authentication required }
        "403": { description: Staff authority required }
        "404": { description: Interview context not found }
    post:
      operationId: approveMeetingAttendance
      tags: [MeetingAssistant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeetingAttendanceApproval" }
      responses:
        "201":
          description: Explicit host approval and participant-consent attestation saved; no bot dispatched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingAttendanceAttempt" }
        "409": { description: Changed or already approved appointment }
  /jobs/{jobId}/candidates/{candidateId}/meeting-assistant/workspace:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string } }
      - { name: candidateId, in: path, required: true, schema: { type: string } }
    put:
      operationId: authorizeMeetingWorkspace
      tags: [MeetingAssistant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeetingWorkspaceAuthorization" }
      responses:
        "200":
          description: Platform administrator explicitly authorized this employer workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingAttendanceView" }
        "403": { description: Platform administrator required }
    delete:
      operationId: revokeMeetingWorkspace
      tags: [MeetingAssistant]
      responses:
        "200":
          description: Workspace revoked and durable cleanup requested; provider cleanup may remain pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingAttendanceView" }
        "403": { description: Employer administrator required }
  /jobs/{jobId}/candidates/{candidateId}/meeting-assistant/attempts/{attendanceId}/{action}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string } }
      - { name: candidateId, in: path, required: true, schema: { type: string } }
      - { name: attendanceId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: action, in: path, required: true, schema: { type: string, enum: [dispatch, stop, recover] } }
    post:
      operationId: actOnMeetingAttendance
      tags: [MeetingAssistant]
      responses:
        "200":
          description: Saved attempt state; uncertain provider acceptance is held, never automatically re-dispatched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingAttendanceAttempt" }
        "409": { description: "Approval, webhook setup or current authority requires attention" }
  /jobs/{jobId}/candidates/{candidateId}/meeting-assistant/attempts/{attendanceId}/import:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string } }
      - { name: candidateId, in: path, required: true, schema: { type: string } }
      - { name: attendanceId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: importMeetingAttendance
      tags: [MeetingAssistant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeetingAttendanceImport" }
      responses:
        "200":
          description: Confirmed MP3 imported as private unprocessed source evidence; provider cleanup requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingAttendanceAttempt" }
        "409": { description: No unique completed recording or current approval }
  /meeting-assistant/recall-events:
    post:
      operationId: receiveRecallAttendanceEvent
      tags: [MeetingAssistant]
      responses:
        "204": { description: Signed lifecycle event handled or safely ignored }
        "401": { description: Invalid signature or stale delivery }
  /meeting-assistant/readiness:
    get:
      operationId: recallAssistantReadiness
      tags: [MeetingAssistant]
      summary: Platform-admin read-only Recall connection diagnostic
      responses:
        "200":
          description: Diagnostic result; this does not authorize or enable attendance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallReadiness"
        "401":
          description: Active staff sign-in required
        "403":
          description: Platform administrator required
components:
  schemas:
    MailHold:
      type: object
      required: [operationId, tenantId, candidateId, kind, reservedAt, version, lastReview, lastReviewedAt]
      properties:
        operationId: { type: string }
        tenantId: { type: string }
        candidateId: { type: string }
        kind: { type: string }
        reservedAt: { type: string }
        version: { type: string }
        lastReview:
          type: [string, "null"]
          enum: [keep_held, closed_no_resend, null]
        lastReviewedAt: { type: [string, "null"] }
    MailHoldPage:
      type: object
      required: [data, hasMore, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MailHold"
        hasMore: { type: boolean }
        nextCursor: { type: [string, "null"] }
    MailHoldReviewInput:
      type: object
      additionalProperties: false
      required: [operationId, version, disposition, evidenceReference, acknowledgeNoResend]
      properties:
        operationId: { type: string, minLength: 1, maxLength: 300 }
        version: { type: string, pattern: "^[0-9a-f]{64}$" }
        disposition:
          type: string
          enum: [keep_held, closed_no_resend]
        evidenceReference:
          type: string
          minLength: 3
          maxLength: 120
          pattern: "^[A-Za-z0-9_.:-]+$"
        acknowledgeNoResend: { type: boolean, enum: [true] }
    MailHoldReviewResult:
      type: object
      required: [reviewId, disposition, holdRetained]
      properties:
        reviewId: { type: string }
        disposition:
          type: string
          enum: [keep_held, closed_no_resend]
        holdRetained: { type: boolean, enum: [true] }
    MeetingWorkspaceAuthorization:
      type: object
      additionalProperties: false
      required: [connectionId, authorized]
      properties:
        connectionId: { type: string, minLength: 1, maxLength: 255 }
        authorized: { type: boolean, const: true }
    MeetingAttendanceApproval:
      type: object
      additionalProperties: false
      required: [scheduleId, consent, consentStatement]
      properties:
        scheduleId: { type: string, format: uuid }
        consent: { type: boolean, const: true }
        consentStatement: { type: string, minLength: 20, maxLength: 1500 }
    MeetingAttendanceImport:
      type: object
      additionalProperties: false
      required: [title, language, consent, consentStatement]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        language: { type: string, pattern: '^[a-z]{2,3}(-[A-Za-z]{2,4})?$' }
        consent: { type: boolean, const: true }
        consentStatement: { type: string, minLength: 20, maxLength: 1500 }
        plannedQuestions: { type: string, maxLength: 6000, default: "" }
    MeetingAttendanceAttempt:
      type: object
      required: [id, scheduleId, state, providerState, approvedAt, stopRequested, mediaDeleted, importedNoteId, updatedAt]
      properties:
        id: { type: string }
        scheduleId: { type: string }
        state:
          type: string
          enum: [approved, dispatching, unknown, scheduled, joining, waiting, recording, processing, done, failed, stopping, stopped, deleted]
        providerState: { type: [string, "null"] }
        approvedAt: { type: string, format: date-time }
        stopRequested: { type: boolean }
        mediaDeleted: { type: boolean }
