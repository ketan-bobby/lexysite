            application/json:
              schema:
                $ref: '#/components/schemas/StorageUploadUrlResult'
        '400':
          description: Missing or invalid required fields.
        '500':
          description: Failed to generate upload URL.

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
        '500':
          description: Failed to serve object.

components:
  schemas:
    LearningGrowthInterestArea:
      type: string
      enum:
        - software_technology
        - data_analytics
        - finance_accounting
        - sales_marketing
        - customer_service
        - operations
        - other
        - exploring

    LearningGrowthPriority:
      type: string
      enum:
        - first_job
        - career_exploration
        - communication
        - interviews
        - role_skills

    LearningGrowthInterests:
      type: object
      additionalProperties: false
      required:
        - careerAreas
        - otherInterest
        - immediateRoles
        - educationStage
        - discipline
        - graduationYear
        - learningPriorities
        - preferredLanguage
        - accessibilityPreferences
        - startTiming
      properties:
        careerAreas:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            $ref: "#/components/schemas/LearningGrowthInterestArea"
        otherInterest:
          type: ["string", "null"]
          maxLength: 250
        immediateRoles:
          type: array
          minItems: 0
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 100
        educationStage:
          type: string
          enum: [studying, graduating, graduated, working, exploring]
        discipline:
          type: ["string", "null"]
          maxLength: 200
        graduationYear:
          type: ["integer", "null"]
          minimum: 1950
          maximum: 2100
        learningPriorities:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: "#/components/schemas/LearningGrowthPriority"
        preferredLanguage:
          type: ["string", "null"]
          maxLength: 100
        accessibilityPreferences:
          type: ["string", "null"]
          maxLength: 500
          description: Optional learning accommodations or preferences; not a medical diagnosis.
        startTiming:
          type: string
          enum: [now, within_month, later, exploring]

    LearningGrowthInterestsInput:
      unevaluatedProperties: false
