            schema: { $ref: "#/components/schemas/AtsInterviewNoteInput" }
      responses:
        "200":
          description: Published or held note receipt; no ATS stage or offer mutation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtsInterviewNoteState" }
        "400": { description: Explicit publication approval required }
        "403": { description: Exact employer administrator required }
        "409": { description: Source changed or publication unavailable }
        "503": { description: Fresh provider verification unavailable }
  /jobs/{jobId}/candidate-workflows/{workflowId}/ats-imports/{recordId}/interview-note-recovery:
    get:
      tags: [recruiting-workflows]
      operationId: getCandidateAtsNoteRecovery
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: workflowId, in: path, required: true, schema: { type: string } }
        - { name: recordId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Private original note attempts; no provider requests
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AtsNoteRecoveryAttempt" } }
        "403": { description: Exact active employer administrator required }
        "409": { description: Applicant authority unavailable }
    post:
      tags: [recruiting-workflows]
      operationId: reconcileCandidateAtsNote
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: workflowId, in: path, required: true, schema: { type: string } }
        - { name: recordId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtsNoteRecoveryInput" }
      responses:
        "200":
          description: Verified existing note; no provider write, resend or release
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AtsNoteRecoveryAttempt" } }
        "400": { description: Explicit evidence acknowledgement required }
        "403": { description: Exact active employer administrator required }
        "409": { description: Stale attempt or nonmatching provider evidence }
        "503": { description: Provider verification unavailable; hold preserved }
  /jobs/{jobId}/candidate-workflows/{workflowId}/ats-imports/{recordId}/interview-invitation-evidence:
    get:
      tags: [recruiting-workflows]
      operationId: getCandidateAtsInvitationEvidence
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: workflowId, in: path, required: true, schema: { type: string } }
        - { name: recordId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Private attempt-bound signed provider observations; no provider calls
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtsInvitationEvidence" }
    post:
      tags: [recruiting-workflows]
      operationId: reconcileCandidateAtsInvitation
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: workflowId, in: path, required: true, schema: { type: string } }
        - { name: recordId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AtsInvitationReconciliationInput" }
      responses:
        "200":
          description: Human recognition of observed acceptance; never sends or releases an attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AtsInvitationEvidence" }
        "409": { description: Evidence changed or exact provider evidence is missing }
