openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Lexy AI Hiring Platform API
servers:
  - url: /api
    description: Base API path

tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: tenants
    description: Tenant management
  - name: users
    description: User management
  - name: jobs
    description: Job management
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: icp
    description: Ideal Candidate Profile
  - name: candidates
    description: Candidate management
  - name: applications
    description: Applications
  - name: interviews
    description: AI Interviews
  - name: prep
    description: Interview Prep Engine
  - name: coordinator
    description: Interview Coordination
  - name: verify
    description: Candidate Verification
  - name: talent-match
    description: Talent Matching
  - name: resume-screen
    description: Resume Screening
  - name: sourcing
    description: Sourcing Engine
  - name: outreach
    description: Outreach Campaigns
  - name: communication
    description: Communication Engine
  - name: analytics
    description: Analytics

paths:
  /zoho-recruit/account:
    get:
      operationId: getZohoRecruitAccount
      tags: [coordinator]
      responses:
        "200":
          description: Exact-employer administrator connection status; no remote records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZohoRecruitAccountView"
  /zoho-recruit/account/connect:
    post:
      operationId: connectZohoRecruitAccount
      tags: [coordinator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZohoRecruitConsent"
      responses:
        "200":
          description: Browser-bound OAuth authorization URL.
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl]
                properties:
                  authorizationUrl: { type: string }
  /zoho-recruit/account/approve:
    post:
      operationId: approveZohoRecruitAccount
      tags: [coordinator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZohoRecruitAccountConfirmation"
      responses:
        "200":
          description: Employer administrator confirmed the displayed account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZohoRecruitAccountView"
  /zoho-recruit/account/disconnect:
    post:
      operationId: disconnectZohoRecruitAccount
      tags: [coordinator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZohoRecruitAccountConfirmation"
      responses:
        "200":
          description: Local credentials removed; upstream consent is not revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZohoRecruitAccountView"
  /zoho-recruit/account/check-access:
    post:
      operationId: checkZohoRecruitAccess
      tags: [coordinator]
      summary: Manually check read permissions without importing records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZohoRecruitAccountConfirmation"
      responses:
        "200":
          description: Dated permission observations only; no record identifiers or fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZohoRecruitAccessCheck"
        "400": { description: Explicit confirmation and revision required }
        "401": { description: Sign in required }
        "403": { description: Employer administrator required }
        "409": { description: Authorization missing or changed }
        "503": { description: Provider check could not be completed }
  /zoho-recruit/imports/preview:
    post:
      operationId: previewZohoRecruitImport
      tags: [Zoho Recruit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZohoRecruitImportSelection"
      responses:
        "200":
          description: Explicitly selected record preview; nothing imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZohoRecruitImportPreview"
  /zoho-recruit/applicants:
    post:
      operationId: listZohoJobApplicants
      tags: [Zoho Recruit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZohoJobApplicantSelection"
      responses:
        "200":
          description: One verified job-scoped application page; no invitations sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZohoJobApplicantPage"
  /zoho-recruit/campaigns:
    get:
      operationId: getZohoCampaignWorkspace
      tags: [Zoho Recruit]
      responses:
        "200":
          description: Employer-scoped campaign history and approved imported job plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZohoCampaignWorkspace"
    post:
      operationId: createZohoInterviewCampaign
      tags: [Zoho Recruit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZohoCampaignSelection"
      responses:
        "200":
          description: Saved applicant snapshot, no invitations sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZohoCampaignDetail"
  /zoho-recruit/campaigns/{id}:
    get:
      operationId: getZohoInterviewCampaign
      tags: [Zoho Recruit]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Saved campaign and recipient progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZohoCampaignDetail"
  /zoho-recruit/campaigns/{id}/reviews:
    get:
      operationId: getZohoCampaignReviewQueue
      tags: [Zoho Recruit]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Campaign-specific interview evidence and local human decision progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZohoCampaignReviewQueue" }
  /zoho-recruit/campaigns/{id}/recipients/{recipientId}/handoff:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: recipientId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getZohoStageHandoff
      tags: [ZohoRecruit]
      responses:
        "200":
          description: Current mapping, reviewed decision and handoff history; live updates disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZohoStageHandoff" }
    post:
      operationId: testZohoStageHandoff
      tags: [ZohoRecruit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZohoStageHandoffInput" }
      responses:
        "200":
          description: Audited simulation only; no Zoho update.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZohoStageHandoff" }
  /zoho-recruit/campaigns/{id}/recipients/{recipientId}/note-preview:
    post:
      operationId: previewZohoInterviewNote
      tags: [coordinator]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: recipientId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZohoInterviewNoteSelection" }
      responses:
        "200":
          description: Current candidate-note text and publication receipts. Does not write to Zoho.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZohoInterviewNotePreview" }
  /zoho-recruit/campaigns/{id}/recipients/{recipientId}/note-publication:
    post:
      operationId: publishZohoInterviewNote
      tags: [coordinator]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: recipientId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZohoInterviewNoteApproval" }
      responses:
        "200":
          description: Provider-acknowledged note or an existing unresolved attempt. Never a stage change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZohoInterviewNoteReceipt" }
  /zoho-recruit/campaigns/{id}/recipients/{recipientId}/stage-requests:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: recipientId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getZohoStageRequests
      tags: [Zoho Recruit]
      responses:
        "200":
          description: Current local requests and execution blockers; no provider reads.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZohoStageRequestWorkspace" }
    post:
      operationId: prepareZohoStageRequest
      tags: [Zoho Recruit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZohoStageRequestInput" }
      responses:
        "200":
          description: Saved local request after explicit read-only Zoho validation; no stage change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZohoStageRequestWorkspace" }
  /zoho-recruit/campaigns/{id}/recipients/{recipientId}/stage-requests/{requestId}/actions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: recipientId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: actOnZohoStageRequest
      tags: [Zoho Recruit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZohoStageRequestAction" }
      responses:
        "200":
          description: Local approval/withdrawal or read-only recovery; never dispatches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZohoStageRequestWorkspace" }
  /zoho-recruit/campaigns/{id}/recipients/{recipientId}/stage-validation:
    post:
      operationId: checkZohoStageMetadata
      tags: [ZohoRecruit]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: recipientId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZohoStageMetadataInput" }
      responses:
        "200":
          description: Read-only application binding and default-catalog check, not transition authorization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZohoStageMetadataCheck" }
  /zoho-recruit/campaigns/{id}/stage-mapping:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: saveZohoStageMapping
      tags: [ZohoRecruit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZohoStageMappingInput" }
      responses:
        "200":
          description: Saved proposed mapping, not provider-verified or live-enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZohoStageMapping" }
  /zoho-recruit/campaigns/{id}/recipients/{recipientId}/review-export:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: recipientId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: prepareZohoReviewExport
      tags: [Zoho Recruit]
      summary: Record preparation of a current human-reviewed handoff, not file delivery
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZohoReviewExportInput" }
      responses:
        "200":
          description: Minimal audit receipt; no ATS update or delivery claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZohoReviewExportReceipt" }
  /zoho-recruit/campaigns/{id}/recipients/{recipientId}/review:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: recipientId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getZohoCampaignApplicantReview
      tags: [Zoho Recruit]
      responses:
        "200":
          description: Job interview evidence and append-only human review history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZohoCampaignApplicantReview" }
    post:
      operationId: recordZohoCampaignApplicantReview
      tags: [Zoho Recruit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZohoCampaignReviewInput" }
      responses:
        "200":
          description: Local human review recorded without changing ATS stages or contacting candidates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZohoCampaignApplicantReview" }
  /zoho-recruit/campaigns/{id}/action:
    post:
      operationId: actOnZohoInterviewCampaign
      tags: [Zoho Recruit]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZohoCampaignAction"
      responses:
        "200":
          description: Human approval or cancellation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZohoCampaignDetail"
  /zoho-recruit/imports/confirm:
    post:
      operationId: confirmZohoRecruitImport
      tags: [Zoho Recruit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZohoRecruitImportConfirmation"
      responses:
        "200":
          description: Record created or explicitly linked without automation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZohoRecruitImportResult"
  /zoho-recruit/callback:
    get:
      operationId: finishZohoRecruitAuthorization
      tags: [coordinator]
      responses:
        "303": { description: Return to the fixed ATS settings page for review. }
  /zoom-account/me:
    get:
      operationId: getZoomStaffAccount
      tags: [coordinator]
      responses:
        "200":
          description: Staff-owned Zoom authorization state, with no tokens exposed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoomStaffAccountView" }
  /zoom-account/me/connect:
    post:
      operationId: beginZoomStaffAccount
      tags: [coordinator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoomStaffConsent" }
      responses:
        "200":
          description: Browser-bound Zoom authorization start.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoomStaffAuthorization" }
  /zoom-account/me/disconnect:
    post:
      operationId: disconnectZoomStaffAccount
      tags: [coordinator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoomStaffDisconnect" }
      responses:
        "200":
          description: Revoked local authorization. Existing Zoom meetings are not cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoomStaffAccountView" }
  /zoom-account/callback:
    get:
      operationId: finishZoomStaffAccount
      tags: [coordinator]
      responses:
        "303": { description: Redirect to account settings after staff OAuth callback }
  /zoom/schedules/{scheduleId}/meeting:
    parameters:
      - { name: scheduleId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getStaffZoomMeeting
      tags: [coordinator]
      responses:
        "200":
          description: Saved Zoom operation receipt, not an invitation or RSVP.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoomMeetingView" }
    post:
      operationId: approveStaffZoomMeeting
      tags: [coordinator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoomMeetingApproval" }
      responses:
        "200":
          description: Zoom provider operation accepted and saved; candidate invitation is separate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoomMeetingView" }
  /zoom/schedules/{scheduleId}/meeting-review:
    post:
      operationId: reviewStaffZoomMeeting
      tags: [coordinator]
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoomMeetingReview" }
      responses:
        "200":
          description: Expiring exact-schedule and staff-account approval review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoomMeetingReviewView" }
  /zoom/schedules/{scheduleId}/meeting-recovery-review:
    post:
      operationId: reviewStaffZoomRecovery
      tags: [coordinator]
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoomRecoveryReview" }
      responses:
        "200":
          description: Read-only Zoom evidence bound to an unresolved operation; no local resolution yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoomRecoveryView" }
  /zoom/schedules/{scheduleId}/meeting-recovery:
    post:
      operationId: approveStaffZoomRecovery
      tags: [coordinator]
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoomRecoveryApproval" }
      responses:
        "200":
          description: Provider evidence rechecked and local recovery atomically audited; no Zoom mutation or invitation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoomMeetingView" }
  /zoom/schedules/{scheduleId}/link:
    parameters:
      - { name: scheduleId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getStaffZoomLink
      tags: [coordinator]
      responses:
        "200":
          description: Staff-provided Zoom link state, never an API receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffZoomLinkView" }
        "401": { description: Sign-in required }
        "403": { description: Staff required }
        "404": { description: Appointment not found }
        "503": { description: Private storage unavailable }
    put:
      operationId: publishStaffZoomLink
      tags: [coordinator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoomLinkApproval" }
      responses:
        "200":
          description: Published in Lexy only; no Zoom mutation or invitation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffZoomLinkView" }
        "400": { description: Invalid request }
        "401": { description: Sign-in required }
        "403": { description: Staff required }
        "404": { description: Appointment not found }
        "409": { description: Review expired or appointment changed }
        "503": { description: Private storage unavailable }
    delete:
      operationId: removeStaffZoomLink
      tags: [coordinator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoomLinkRemoval" }
      responses:
        "200":
          description: Removed from Lexy, not cancelled in Zoom.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffZoomLinkView" }
        "400": { description: Invalid request }
        "401": { description: Sign-in required }
        "403": { description: Staff required }
        "404": { description: Appointment not found }
        "409": { description: Appointment or publication changed }
        "503": { description: Private storage unavailable }
  /zoom/schedules/{scheduleId}/link-review:
    post:
      operationId: reviewStaffZoomLink
      tags: [coordinator]
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoomLinkDraft" }
      responses:
        "200":
          description: Expiring review bound to staff, link, native time and current publication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffZoomLinkView" }
        "400": { description: Invalid Zoom join link }
        "401": { description: Sign-in required }
        "403": { description: Staff required }
        "404": { description: Appointment not found }
        "409": { description: Appointment changed or not eligible }
        "503": { description: Private storage unavailable }
  /portal/interview-schedules/{scheduleId}/zoom-link:
    get:
      operationId: getCandidateZoomLink
      tags: [interviews]
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Current candidate-owned staff-provided link only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateZoomLinkView" }
        "401": { description: Candidate sign-in required }
        "404": { description: Appointment not found }
        "503": { description: Details unavailable }
  /google-calendar/panel-consent:
    get:
      operationId: getGooglePanelConsent
      tags: [Scheduling]
      responses:
        "200":
          description: Own current Google panel-sharing permission, not Outlook or invitation consent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GooglePanelConsentView" }
        "401": { description: Sign-in required }
        "403": { description: Active staff required }
        "503": { description: Sharing state unavailable }
    post:
      operationId: setGooglePanelConsent
      tags: [Scheduling]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GooglePanelConsentInput" }
      responses:
        "200":
          description: Explicit own sharing grant or withdrawal; no calendar event was changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GooglePanelConsentView" }
        "400": { description: Explicit sharing acknowledgement required }
        "401": { description: Sign-in required }
        "403": { description: Active staff required }
        "409": { description: Connection changed }
        "503": { description: Sharing state unavailable }
  /google-calendar/schedules/{scheduleId}/panel:
    get:
      operationId: getSavedGoogleSchedulePanel
      tags: [Scheduling]
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Saved native panel with provider identity but no private account bindings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedSchedulePanel" }
        "401": { description: Sign-in required }
        "404": { description: Authorized human interview not found }
        "503": { description: Saved panel unavailable }
    put:
      operationId: saveGoogleSchedulePanel
      tags: [Scheduling]
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchedulePanelInput" }
      responses:
        "200":
          description: Native Google panel saved or deliberately removed without provider mutations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedSchedulePanel" }
        "400": { description: Invalid panel or removal }
        "401": { description: Sign-in required }
        "404": { description: Authorized human interview not found }
        "409": { description: Interview or provider panel changed }
        "503": { description: Calendar unknown; no save confirmed }
  /google-calendar/schedules/{scheduleId}/panel-members:
    get:
      operationId: getGooglePanelMembers
      tags: [Scheduling]
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Eligible staff who explicitly shared their current Google account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GooglePanelMembersView" }
        "401": { description: Sign-in required }
        "403": { description: Coordinating staff required }
        "404": { description: Upcoming authorized interview not found }
        "503": { description: Directory unavailable }
  /google-calendar/schedules/{scheduleId}/panel-times:
    post:
      operationId: findGooglePanelTimes
      tags: [Scheduling]
      parameters:
        - { name: scheduleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GooglePanelTimesInput" }
      responses:
        "200":
