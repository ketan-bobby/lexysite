      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowDecisionCorrectionInput" }
      responses:
        "200":
          description: Correction, offer consequences and audit saved atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowMutationResult" }
        "400": { description: Missing reason or invalid input }
        "401": { description: Authentication required }
        "403": { description: Human approval authority required }
        "404": { description: Workflow or candidate not visible }
        "409": { description: "Stale, legacy, paused, cancelled or delivery-in-progress conflict" }

