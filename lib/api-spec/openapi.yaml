openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Lexy AI Hiring Platform API
servers:
  - url: /api
    description: Base API path

tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: tenants
    description: Tenant management
  - name: users
    description: User management
  - name: jobs
    description: Job management
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: icp
    description: Ideal Candidate Profile
  - name: candidates
    description: Candidate management
  - name: applications
    description: Applications
  - name: interviews
    description: AI Interviews
  - name: prep
    description: Interview Prep Engine
  - name: coordinator
    description: Interview Coordination
  - name: verify
    description: Candidate Verification
  - name: talent-match
    description: Talent Matching
  - name: resume-screen
    description: Resume Screening
  - name: sourcing
    description: Sourcing Engine
  - name: outreach
    description: Outreach Campaigns
  - name: communication
    description: Communication Engine
  - name: analytics
    description: Analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/candidate-login:
    post:
      operationId: candidateLogin
      tags: [auth]
      summary: Candidate login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # TENANTS
  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List all tenants
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/{tenantId}:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get tenant
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
    put:
      operationId: updateTenant
      tags: [tenants]
      summary: Update tenant
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        "200":
          description: Tenant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  # USERS
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      parameters:
        - name: role
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # JOBS
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Jobs list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsListResponse"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{jobId}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    put:
      operationId: updateJob
      tags: [jobs]
      summary: Update job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobRequest"
      responses:
        "200":
          description: Job updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ICP
  /jobs/{jobId}/icp:
    get:
      operationId: getJobIcp
      tags: [icp]
      summary: Get ICP for job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ICP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeaCandiateProfile"
    post:
      operationId: generateIcp
      tags: [icp]
      summary: Generate ICP from JD
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateIcpRequest"
      responses:
        "200":
          description: Generated ICP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeaCandiateProfile"

  /jobs/{jobId}/icp/versions:
    get:
      operationId: listIcpVersions
      tags: [icp]
      summary: List ICP versions
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ICP versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdeaCandiateProfile"

  # CANDIDATES
  /candidates:
    get:
      operationId: listCandidates
      tags: [candidates]
      summary: List candidates
      parameters:
        - name: jobId
          in: query
          schema:
            type: string
        - name: stage
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidatesListResponse"
    post:
      operationId: createCandidate
      tags: [candidates]
      summary: Create candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCandidateRequest"
      responses:
        "201":
          description: Candidate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"

  /candidates/{candidateId}:
    get:
      operationId: getCandidate
      tags: [candidates]
      summary: Get candidate
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
    put:
      operationId: updateCandidate
      tags: [candidates]
      summary: Update candidate
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCandidateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"

  /candidates/{candidateId}/introduction:
    get:
      operationId: getCandidateIntroduction
      tags: [candidates]
      summary: Get a candidate-approved written introduction
      description: Returns only the candidate's currently approved allowlisted introduction when the caller has an authorised candidate relationship. Private career, evaluation, transcript, and recording data are never included.
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Candidate-approved introduction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedCandidateIntroduction"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Candidate or approved introduction is unavailable to this caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portal/introduction:
    get:
      operationId: getPortalIntroduction
      tags: [candidates]
      summary: Get the authenticated candidate's private introduction draft
      responses:
        "200":
          description: Candidate's private introduction draft and sharing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateIntroductionDraft"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateCandidateIntroduction
      tags: [candidates]
      summary: Save the authenticated candidate's written introduction
      description: Saving any change revokes an existing approval and returns the introduction to draft status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateIntroductionInput"
      responses:
        "200":
          description: Saved private draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateIntroductionDraft"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portal/introduction/approve:
    post:
      operationId: approveCandidateIntroduction
      tags: [candidates]
      summary: Approve an introduction for authorised employer sharing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateIntroductionApprovalInput"
      responses:
        "200":
          description: Approved introduction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateIntroductionDraft"
        "409":
          description: The supplied draft version is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Required candidate-entered introduction fields are missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portal/introduction/withdraw:
    post:
      operationId: withdrawCandidateIntroduction
      tags: [candidates]
      summary: Withdraw employer sharing for the authenticated candidate's introduction
      responses:
        "200":
          description: Withdrawn private draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateIntroductionDraft"
        "404":
          description: Introduction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # APPLICATIONS
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List applications
      parameters:
        - name: jobId
          in: query
          schema:
            type: string
        - name: candidateId
          in: query
          schema:
            type: string
        - name: stage
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Create application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /applications/{applicationId}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
    put:
      operationId: updateApplication
      tags: [applications]
      summary: Update application stage
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  # AI INTERVIEWS
  /interviews:
    get:
      operationId: listInterviews
      tags: [interviews]
      summary: List interviews
      parameters:
        - name: applicationId
          in: query
          schema:
            type: string
        - name: candidateId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Interviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InterviewSession"

  /interviews/plans:
    post:
      operationId: createInterviewPlan
      tags: [interviews]
      summary: Create interview plan from JD + ICP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInterviewPlanRequest"
      responses:
        "201":
          description: Interview plan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewPlan"

  /interviews/start:
    post:
      operationId: startInterview
      tags: [interviews]
      summary: Start an interview session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartInterviewRequest"
      responses:
        "201":
          description: Interview started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"

  /interviews/{interviewId}:
    get:
      operationId: getInterview
      tags: [interviews]
      summary: Get interview
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Interview session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"

  /interviews/{interviewId}/answer:
    post:
      operationId: submitInterviewAnswer
      tags: [interviews]
      summary: Submit an answer
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAnswerRequest"
      responses:
        "200":
          description: Next question or completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResponse"

  /interviews/{interviewId}/end:
    post:
      operationId: endInterview
      tags: [interviews]
      summary: End interview
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Interview ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSummary"

  /interviews/{interviewId}/summary:
    get:
      operationId: getInterviewSummary
      tags: [interviews]
      summary: Get interview summary
      parameters:
        - name: interviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSummary"

  # CANDIDATE PREP
  /prep/generate:
    post:
      operationId: generatePrepPlan
      tags: [prep]
      summary: Generate prep plan for candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePrepRequest"
      responses:
        "200":
          description: Prep plan generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepPlan"

  /prep/sessions:
    get:
      operationId: listPrepSessions
      tags: [prep]
      summary: List prep sessions
      parameters:
        - name: candidateId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Prep sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrepSession"
    post:
      operationId: startPrepSession
      tags: [prep]
      summary: Start prep session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPrepSessionRequest"
      responses:
        "201":
          description: Prep session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepSession"

  /prep/sessions/{sessionId}/answer:
    post:
      operationId: submitPrepAnswer
      tags: [prep]
      summary: Submit prep answer
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAnswerRequest"
      responses:
        "200":
          description: Feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepFeedback"

  # COORDINATOR
  /coordinator/schedules:
    get:
      operationId: listSchedules
      tags: [coordinator]
      summary: List interview schedules
      parameters:
        - name: applicationId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InterviewSchedule"
    post:
      operationId: createSchedule
      tags: [coordinator]
      summary: Create schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleRequest"
      responses:
        "201":
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSchedule"

  /coordinator/schedules/{scheduleId}:
    put:
      operationId: updateSchedule
      tags: [coordinator]
      summary: Update/reschedule
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSchedule"

  # VERIFY
  /verify/{candidateId}:
    get:
      operationId: getVerificationStatus
      tags: [verify]
      summary: Get verification status
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verification status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationStatus"
    post:
      operationId: runVerification
      tags: [verify]
      summary: Run verification checks
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationStatus"

  # TALENT MATCH
  /talent-match:
    post:
      operationId: matchCandidateToIcp
      tags: [talent-match]
      summary: Match candidate to ICP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TalentMatchRequest"
      responses:
        "200":
          description: Match result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TalentMatch"

  /talent-match/rediscover:
    post:
      operationId: rediscoverCandidates
      tags: [talent-match]
      summary: Rediscover ATS candidates for a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RediscoverRequest"
      responses:
        "200":
          description: Rediscovered candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TalentMatch"

  # RESUME SCREENS
  /resume-screens:
    post:
      operationId: screenResume
      tags: [resume-screen]
      summary: Screen a resume against ICP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenResumeRequest"
      responses:
        "200":
          description: Screening result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeScreen"

  /resume-screens/{candidateId}:
    get:
      operationId: getResumeScreen
