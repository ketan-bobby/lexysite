      type: object
      required: [briefHash, canEdit, canApprove, currency, sourcingScope, executionEnabled, outreachEnabled, trustedPricingAvailable, policy, reservations, allocatedCents, availableCents, blockers, spentMicros, uncertainMicros, pendingMicros, costOperations, costAnalysis]
